[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wilfred-butler"
version = "0.2.3.dev0"
description = "Public and extensible Butler runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "butler-core @ git+https://github.com/keriol/butler-core.git@827bbac1038b6591f88648e5b69e50ae66834c19",
]

[project.scripts]
wilfred = "wilfred.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
openai = [
    "openai>=2.53,<3",
]
http = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.34,<1",
]
dev = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "pydantic>=2.9,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "setuptools>=68",
    "uvicorn>=0.34,<1",
    "wheel>=0.45",
]
