[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wilfred-butler"
version = "0.1.8.dev0"
description = "Public and extensible Butler runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "butler-core @ https://github.com/keriol/butler-core/releases/download/v0.1.1/butler_core-0.1.1-py3-none-any.whl#sha256=a5e105278ee5fa14de4cfb0d05f5061f50a3a9679a6081a42f0e1b61a82b1f99",
]

[project.scripts]
wilfred = "wilfred.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "setuptools>=68",
    "wheel>=0.45",
]
