[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wilfred-butler"
version = "0.1.9"
description = "Public and extensible Butler runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "butler-core @ https://github.com/keriol/butler-core/releases/download/v0.1.3/butler_core-0.1.3-py3-none-any.whl#sha256=f855dfa791c9cc128c4d51b90e21f5281ce352788c0ba6396adc76581762014a",
]

[project.scripts]
wilfred = "wilfred.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
openai = [
    "openai>=2.53,<3",
]
http = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.34,<1",
]
dev = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "pydantic>=2.9,<3",
    "pytest>=9,<10",
    "setuptools>=68",
    "uvicorn>=0.34,<1",
    "wheel>=0.45",
]
