[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wilfred-butler"
version = "0.1.0"
description = "Public and extensible Butler runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wilfred = "wilfred.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
