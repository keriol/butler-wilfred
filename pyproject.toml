[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wilfred-butler"
version = "0.2.2"
description = "Public and extensible Butler runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "butler-core @ https://github.com/keriol/butler-core/releases/download/v0.2.0/butler_core-0.2.0-py3-none-any.whl#sha256=40e18d5ef5792c9c5dad807287ae6717e6a0ba0833751503c2ab06c9c2405736",
]

[project.scripts]
wilfred = "wilfred.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
openai = [
    "openai>=2.53,<3",
]
http = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.34,<1",
]
dev = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "pydantic>=2.9,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "setuptools>=68",
    "uvicorn>=0.34,<1",
    "wheel>=0.45",
]
