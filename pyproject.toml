[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wilfred-butler"
version = "0.1.9.dev0"
description = "Public and extensible Butler runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "butler-core @ https://github.com/keriol/butler-core/releases/download/v0.1.2/butler_core-0.1.2-py3-none-any.whl#sha256=bd515d0317965bb24d98a4dfc26069855b9da33184bafb4829ad91c93d14727d",
]

[project.scripts]
wilfred = "wilfred.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
openai = [
    "openai>=2.53,<3",
]
http = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.34,<1",
]
dev = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "pydantic>=2.9,<3",
    "pytest>=9,<10",
    "setuptools>=68",
    "uvicorn>=0.34,<1",
    "wheel>=0.45",
]
