name: Wilfred CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install build

      - name: Install Wilfred
        run: |
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: |
          python -m compileall -q src tests

      - name: Run test suite
        run: |
          pytest -q

      - name: Build package
        run: |
          python -m build

      - name: Verify distributions
        run: |
          ls -lh dist/
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"

      - name: Clean-room wheel install
        run: |
          python -m venv /tmp/wilfred-wheel-test
          source /tmp/wilfred-wheel-test/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

          python -c "import wilfred; print('Wilfred import: OK')"
          python -m pip check

          command -v wilfred
          wilfred --help

      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: wilfred-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
